<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Only what the app's own page really loads (see shellPolicy.ts): its own files; site icons, article
      images and capture previews as data: URLs; NASA satellite pictures and capture videos as blob: URLs;
      captures from intoponet-capture:; Wikipedia thumbnails on the globe; the satellite picture service.
      The hash is framer-motion's empty style element for exit animations (its rules are added through CSSOM).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='; img-src 'self' data: blob: intoponet-capture: https://upload.wikimedia.org; media-src blob:; font-src 'self'; connect-src 'self' intoponet-capture: https://wvs.earthdata.nasa.gov; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#061320" />
    <title>intoponet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
